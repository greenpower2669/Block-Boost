name: 🐾 Block Boost — APK Festival Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/block-boost-playable-rotation-v1
      - feature/emotional-voice-multithread-020
      - feature/fast-bonus-no-rotation-030
      - feature/audio-haptics-variety-040
      - feature/haptic-sonar-combo-bonus-050
      - feature/silent-rainbow-solves-060
      - feature/festival-animation-djipie-audio-070
      - feature/voice-toggle-disco-sprites-080
      - feature/concert-bonus-audio-safearea-090
      - feature/bubbles-cross10-licensed-audio-100
      - feature/restore-disco-and-cross-bubbles-011
      - feature/score-comeback-victory-music-012
      - feature/final-result-fireworks-013
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: blockboost-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Construire et vérifier BlockBoost-0.13.0-fireworks-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Vérifier les tests du moteur
        run: node --test tests/*.test.mjs

      - name: Compiler et signer avec la clé Android debug (retentatives réseau Gradle)
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle attempt $attempt / 3"
            if gradle --no-daemon --stacktrace :app:assembleDebug; then
              echo "Gradle compilation successful"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependencies temporarily unavailable; retrying after delay"
              sleep 25
            fi
          done
          echo "Gradle compilation failed after 3 attempts" >&2
          exit 1

      - name: Vérifier le contenu APK et le nommer
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/BlockBoost-0.13.0-fireworks-debug.apk
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/index.html'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/main.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/festival.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/disco-sprites.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/concert-cues.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/victory-music.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/fireworks.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/result-celebration.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/private-audio.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/src/kenney-audio.mjs'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'assets/www/assets/kenney-manifest.json'
          unzip -l android/dist/BlockBoost-0.13.0-fireworks-debug.apk | grep -F 'classes.dex'
          sha256sum android/dist/BlockBoost-0.13.0-fireworks-debug.apk | tee android/dist/BlockBoost-0.13.0-fireworks-debug.sha256

      - name: Publier l'APK en artifact GitHub (quota facultatif)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BlockBoost-0.13.0-fireworks-debug-APK
          path: |
            android/dist/BlockBoost-0.13.0-fireworks-debug.apk
            android/dist/BlockBoost-0.13.0-fireworks-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Créer le fichier APK direct sans ZIP sur une branche temporaire
        if: github.ref_name == 'feature/final-result-fireworks-013'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/temp/blockboost-fireworks-0.13.0 >/dev/null; then
            git fetch origin temp/blockboost-fireworks-0.13.0
            git checkout -b temp/blockboost-fireworks-0.13.0 FETCH_HEAD
          else
            git checkout -b temp/blockboost-fireworks-0.13.0
          fi
          mkdir -p temp/android
          cp android/dist/BlockBoost-0.13.0-fireworks-debug.apk temp/android/
          cp android/dist/BlockBoost-0.13.0-fireworks-debug.sha256 temp/android/
          sed -i 's#android/dist/#temp/android/#' temp/android/BlockBoost-0.13.0-fireworks-debug.sha256
          sha256sum -c temp/android/BlockBoost-0.13.0-fireworks-debug.sha256
          printf "%s\n" "# Block Boost Fireworks 0.13.0 — APK expérimentale" "" \
            "Cette APK debug désactive les voix par défaut mais les rend activables, améliore la boule disco et 24 sons Kenney CC0 pris dans Djipie." \
            "Elle s'installe séparément des laboratoires 0.1 à 0.6 ; sauvegardes indépendantes." \
            "Cette build PUBLIQUE ne contient pas les sons Sonniss de Djipie. Aucun merge main ni publication Google Play." > temp/android/README.md
          git add temp/android
          git diff --cached --quiet || git commit -m "artifact(android): livrer APK Fireworks 0.13.0 en lien direct"
          git push origin HEAD:refs/heads/temp/blockboost-fireworks-0.13.0
          git ls-remote --exit-code origin refs/heads/temp/blockboost-fireworks-0.13.0
          echo "## 🎙️ Block Boost Fireworks 0.13.0 — APK directe" >> "$GITHUB_STEP_SUMMARY"
          echo "[Télécharger le fichier APK (pas un ZIP)](https://raw.githubusercontent.com/\${{ github.repository }}/temp/blockboost-fireworks-0.13.0/temp/android/BlockBoost-0.13.0-fireworks-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
