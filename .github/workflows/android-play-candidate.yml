name: 🔐 Block Boost 0.14 — Candidat AAB signé Play

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate:
    if: github.repository == 'greenpower2669/Block-Boost' && github.ref_name == 'feature/final-result-fireworks-013'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Outils Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Tests métier
        run: node --test tests/*.test.mjs
      - name: Restaurer la JKS et comparer avec le PEM public historique
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Secret absent : $variable"
              exit 1
            fi
          done
          if [ "$ANDROID_UPLOAD_KEY_ALIAS" != "blockboost-upload" ]; then
            echo "::error::Alias d'importation inattendu"
            exit 1
          fi
          EXPECTED=android/certificates/BlockBoost-upload-certificate.pem
          if [ ! -s "$EXPECTED" ]; then
            echo "::error::PEM public de référence absent : ajouter le certificat PUBLIC avant la signature"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            -file "$RUNNER_TEMP/actual.pem" >/dev/null
          openssl x509 -in "$EXPECTED" -outform DER > "$RUNNER_TEMP/expected.der"
          openssl x509 -in "$RUNNER_TEMP/actual.pem" -outform DER > "$RUNNER_TEMP/actual.der"
          cmp "$RUNNER_TEMP/expected.der" "$RUNNER_TEMP/actual.der"
          {
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE_PASSWORD=$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            echo "ANDROID_UPLOAD_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Vraie APK release et vrai AAB, même Upload Key
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Vérifier identité et ressources intégrées
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='fr.greenpower.blockboost' versionCode='14' versionName='0.14.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB" | grep -F 'jar verified.'
          unzip -l "$AAB" | grep -F 'base/assets/www/src/winning-snap.mjs'
          unzip -l "$AAB" | grep -F 'base/assets/www/src/fireworks.mjs'
          unzip -l "$AAB" | grep -F 'base/assets/www/styles.css'
          unzip -l "$AAB" | grep -F 'base/dex/classes.dex'
          mkdir -p android/dist
          cp "$APK" android/dist/BlockBoost-0.14.0-release-candidate.apk
          cp "$AAB" android/dist/BlockBoost-0.14.0-release-candidate.aab
          (cd android/dist && sha256sum *.apk *.aab > SHA256SUMS)
      - name: Supprimer les fichiers secrets éphémères
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/actual.pem" "$RUNNER_TEMP/actual.der" "$RUNNER_TEMP/expected.der"
      - name: Conserver les binaires candidats distincts sans GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: BlockBoost-0.14.0-signed-candidate
          path: |
            android/dist/*.apk
            android/dist/*.aab
            android/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
