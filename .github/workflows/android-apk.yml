name: 🐾 Block Boost — APK Android debug et voix expressives

on:
  workflow_dispatch:
  push:
    branches:
      - feature/block-boost-playable-rotation-v1
      - feature/emotional-voice-multithread-020
      - feature/fast-bonus-no-rotation-030
      - feature/audio-haptics-variety-040
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: blockboost-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Construire et vérifier BlockBoost-0.4.0-audio-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier les tests du moteur
        run: node --test tests/*.test.mjs

      - name: Compiler et signer avec la clé Android debug
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier le contenu APK et le nommer
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/BlockBoost-0.4.0-audio-debug.apk
          unzip -l android/dist/BlockBoost-0.4.0-audio-debug.apk | grep -F 'assets/www/index.html'
          unzip -l android/dist/BlockBoost-0.4.0-audio-debug.apk | grep -F 'assets/www/src/main.mjs'
          unzip -l android/dist/BlockBoost-0.4.0-audio-debug.apk | grep -F 'classes.dex'
          sha256sum android/dist/BlockBoost-0.4.0-audio-debug.apk | tee android/dist/BlockBoost-0.4.0-audio-debug.sha256

      - name: Publier l'APK en artifact GitHub (pas de release)
        uses: actions/upload-artifact@v4
        with:
          name: BlockBoost-0.4.0-audio-debug-APK
          path: |
            android/dist/BlockBoost-0.4.0-audio-debug.apk
            android/dist/BlockBoost-0.4.0-audio-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Créer le fichier APK direct sans ZIP sur une branche temporaire
        if: github.ref_name == 'feature/audio-haptics-variety-040'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/temp/blockboost-audio-0.4.0 >/dev/null; then
            git fetch origin temp/blockboost-audio-0.4.0
            git checkout -b temp/blockboost-audio-0.4.0 FETCH_HEAD
          else
            git checkout -b temp/blockboost-audio-0.4.0
          fi
          mkdir -p temp/android
          cp android/dist/BlockBoost-0.4.0-audio-debug.apk temp/android/
          cp android/dist/BlockBoost-0.4.0-audio-debug.sha256 temp/android/
          sed -i 's#android/dist/#temp/android/#' temp/android/BlockBoost-0.4.0-audio-debug.sha256
          sha256sum -c temp/android/BlockBoost-0.4.0-audio-debug.sha256
          printf "%s\n" "# Block Boost Audio 0.4.0 — APK expérimentale" "" \
            "Cette APK debug ajoute les 388 nouvelles phrases, FX de décrochage/position valide et haptique, avec annonces vocales." \
            "Elle s'installe séparément de Block Boost 0.1.0, Émotion 0.2.0 et Bonus 0.3.0 ; sauvegardes indépendantes." \
            "Aucun merge main, aucune publication Google Play." > temp/android/README.md
          git add temp/android
          git diff --cached --quiet || git commit -m "artifact(android): livrer APK audio 0.4.0 en lien direct"
          git push origin HEAD:refs/heads/temp/blockboost-audio-0.4.0
          git ls-remote --exit-code origin refs/heads/temp/blockboost-audio-0.4.0
          echo "## 🎙️ Block Boost Audio 0.4.0 — APK directe" >> "$GITHUB_STEP_SUMMARY"
          echo "[Télécharger le fichier APK (pas un ZIP)](https://raw.githubusercontent.com/\${{ github.repository }}/temp/blockboost-audio-0.4.0/temp/android/BlockBoost-0.4.0-audio-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
