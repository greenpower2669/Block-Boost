plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.greenpower.blockboost'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.greenpower.blockboost'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '0.16.0'
    }

    // The Upload Key exists only on a controlled CI runner, never in Git.
    signingConfigs {
        uploadRelease {
            def keyPath = System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.uploadRelease
        }
        debug { debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The Web application stays in the repository root as the single source of truth.
// Copy it into the Android package at build time; no edits to the source files.
tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'styles.css', 'manifest.webmanifest', 'sw.js'
        include 'src/**/*.mjs', 'assets/**', 'Blockboostmusic.mp3'
    }
    into(layout.projectDirectory.dir('src/main/assets/www'))
}
tasks.named('preBuild').configure { dependsOn(tasks.named('syncWebAssets')) }
