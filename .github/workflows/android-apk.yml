name: 🐾 Block Boost — APK Android debug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/block-boost-playable-rotation-v1
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire et vérifier BlockBoost-0.1.0-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer le SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier les tests du moteur
        run: node --test tests/*.test.mjs

      - name: Compiler et signer avec la clé Android debug
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier le contenu APK et le nommer
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/BlockBoost-0.1.0-debug.apk
          unzip -l android/dist/BlockBoost-0.1.0-debug.apk | grep -F 'assets/www/index.html'
          unzip -l android/dist/BlockBoost-0.1.0-debug.apk | grep -F 'assets/www/src/main.mjs'
          unzip -l android/dist/BlockBoost-0.1.0-debug.apk | grep -F 'classes.dex'
          sha256sum android/dist/BlockBoost-0.1.0-debug.apk | tee android/dist/BlockBoost-0.1.0-debug.sha256

      - name: Publier l'APK en artifact GitHub (pas de release)
        uses: actions/upload-artifact@v4
        with:
          name: BlockBoost-0.1.0-debug-APK
          path: |
            android/dist/BlockBoost-0.1.0-debug.apk
            android/dist/BlockBoost-0.1.0-debug.sha256
          if-no-files-found: error
          retention-days: 30
