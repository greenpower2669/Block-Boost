name: 🐾 Block Boost 0.15 — Anti-fausse-défaite APK complète
on:
  workflow_dispatch:
  push:
    branches: [feature/rotation-gameover-fix-015]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/android-rotation-fix-015.yml'
permissions:
  contents: write
concurrency:
  group: blockboost-rotation-fix-015
  cancel-in-progress: true
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Tester toute la logique (y compris faux game over + rotations)
        run: node --test tests/*.test.mjs
      - name: Réintégrer les 21 OGG du jeu complet, vérifier leur source
        run: |
          python3 scripts/reuse_blockboost_013_audio.py .
          test "$(find assets/licensed -name '*.ogg' | wc -l)" -eq 21
      - name: Compiler Android debug
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Inspecter le contenu et garantir le correctif dans l'APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/BlockBoost-0.15.0-rotation-fix-debug.apk
          APK=android/dist/BlockBoost-0.15.0-rotation-fix-debug.apk
          unzip -p "$APK" assets/www/src/engine.mjs | grep -F 'shapeFits(board,piece.coords)'
          unzip -Z1 "$APK" | grep -Fx 'assets/www/Blockboostmusic.mp3'
          unzip -Z1 "$APK" | grep -Fx 'assets/www/src/music-bed.mjs'
          unzip -Z1 "$APK" | grep -Fx 'assets/www/src/main.mjs'
          unzip -Z1 "$APK" | grep -Fx 'assets/www/assets/licensed/result-guitar.ogg'
          SOUND_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^assets/www/assets/licensed/.*\.ogg$')"
          test "$SOUND_COUNT" -eq 21
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='fr.greenpower.blockboost' versionCode='15' versionName='0.15.0'"
          (cd android/dist && sha256sum BlockBoost-0.15.0-rotation-fix-debug.apk > BlockBoost-0.15.0-rotation-fix-debug.sha256)
      - name: Sauver les binaires en artifacts Actions
        uses: actions/upload-artifact@v4
        with:
          name: BlockBoost-0.15.0-rotation-fix-debug
          path: |
            android/dist/*.apk
            android/dist/*.sha256
          retention-days: 30
      - name: Déposer le .apk direct sur une branche temporaire (sans ZIP)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/licensed
          git restore -- src/private-audio.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEST=temp/blockboost-rotation-fix-015
          if git ls-remote --exit-code origin "refs/heads/$DEST" >/dev/null; then
            git fetch origin "$DEST"
            git checkout -B "$DEST" FETCH_HEAD
          else
            git checkout -b "$DEST"
          fi
          mkdir -p temp/android
          cp android/dist/BlockBoost-0.15.0-rotation-fix-debug.apk temp/android/
          cp android/dist/BlockBoost-0.15.0-rotation-fix-debug.sha256 temp/android/
          # The checksum file contains the bare filename. Verify from its
          # containing directory, not the repository root.
          (cd temp/android && sha256sum -c BlockBoost-0.15.0-rotation-fix-debug.sha256)
          cat > temp/android/README-rotation-fix.md <<'EOF'
          Block Boost 0.15.0, APK DEBUG complète de test.
          Correction rotation/fin de partie, 21 sons et musique offline.
          AUCUNE fusion main ni publication Google Play par ce workflow.
          EOF
          git add temp/android/BlockBoost-0.15.0-rotation-fix-debug.apk temp/android/BlockBoost-0.15.0-rotation-fix-debug.sha256 temp/android/README-rotation-fix.md
          git diff --cached --quiet || git commit -m "artifact(android): BlockBoost 0.15 rotation-fix debug direct apk"
          git push origin HEAD:"refs/heads/$DEST"
          echo "## Block Boost 0.15 — APK corrigée sans ZIP" >> "$GITHUB_STEP_SUMMARY"
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEST/temp/android/BlockBoost-0.15.0-rotation-fix-debug.apk" >> "$GITHUB_STEP_SUMMARY"
